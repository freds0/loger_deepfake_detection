# DINOv3 base. Requires a transformers build with DINOv3 support.
# data.normalization_mean/std in configs/data/*.yaml default to SigLIP stats
# ([0.5,0.5,0.5]/[0.5,0.5,0.5]) -- override to ImageNet stats when using this
# backbone: data.normalization_mean=[0.485,0.456,0.406]
#           data.normalization_std=[0.229,0.224,0.225]
# (see normalization_stats() in src/models/backbones.py)
name: dinov3-base
model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
image_size: 224
freeze: true
pretrained: true
config_overrides: null
gradient_checkpointing: false
