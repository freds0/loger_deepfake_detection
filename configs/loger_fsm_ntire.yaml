# LOGER on the NTIRE 2026 Robust AI-generated Image Detection In The Wild
# dataset. FSM is disabled: NTIRE has no per-generator domain labels, only a
# binary real/fake label, so the Forgery Style Mixture module (which mixes
# style across distinct forgery domains) has nothing meaningful to condition on.
defaults:
  - backbone: siglip2_base
  - model: loger
  - peft: full
  - fsm: default
  - loss: loger
  - optimizer: adamw
  - scheduler: cosine
  - data: ntire
  - trainer: default
  - logger: default
  - callbacks: loger
  - _self_

seed: 0
# Non-deterministic + cudnn benchmark: seed still fixes init/data order, and a
# long NTIRE run benefits more from cudnn autotune than from bitwise
# reproducibility. build_trainer() sets Trainer(benchmark=not deterministic).
deterministic: false
ckpt_path: null
tune_batch_size: false   # when true, find data.batch_size via binary search and exit (no fit)
output_dir: ./outputs
resume:
  enabled: true
  dir: outputs/loger_fsm_ntire   # experiment root scanned for last.ckpt

trainer:
  precision: bf16-mixed   # Hopper/Blackwell: no GradScaler, more stable than fp16

# Linear LR warmup before the cosine schedule (~1.6% of max_steps=30000):
# full fine-tune of a pretrained VFM at lr=3e-5 risks destroying pretrained
# features in the first few steps without it.
scheduler:
  warmup_steps: 500

fsm:
  enabled: false

data:
  augmentation:
    enabled: true
    hflip: 0.5
    random_resize: 0.2
    jpeg: 0.3
    gaussian_blur: 0.2
    motion_blur: 0.1
    gaussian_noise: 0.1
    brightness: 0.2
    contrast: 0.2
    color_jitter: 0.2
    random_crop: 0.2

model:
  eval_resolutions: [224]

hydra:
  run:
    dir: outputs/loger_fsm_ntire/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
