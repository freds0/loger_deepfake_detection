# LOGER objective: global/fused BCE + local CE/AUC/MIL/regularization.
global_weight: 1.0
fused_weight: 1.0
ce_weight: 1.0
auc_weight: 0.5
mil_weight: 0.5
reg_weight: 1.0e-4
auc_margin: 1.0
pos_weight: null
# Focal Loss on the image-level (global + fused) terms; local L_CE stays BCE.
focal: false
focal_gamma: 2.0
focal_alpha: 0.25
# Single-Center Loss on the global-head penultimate features (0 disables).
scl_weight: 0.0
scl_margin: 0.01
